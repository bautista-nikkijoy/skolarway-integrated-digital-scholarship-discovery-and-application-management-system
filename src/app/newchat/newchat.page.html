<ion-content fullscreen class="whole">
  <!-- Toolbar with Date, Battery, Signal, and Wifi -->
  <ion-toolbar class="custom-toolbar">
    <ion-buttons slot="start">
      <ion-text color="medium" class="header-time">{{ currentTime }}</ion-text>
    </ion-buttons>
  
    <ion-buttons slot="end">
       <ion-icon name="cellular" class="signal-icon"></ion-icon>
       <ion-icon name="wifi" class="wifi-icon"></ion-icon>
       <ion-icon name="battery-full" class="battery-icon"></ion-icon>
    </ion-buttons>
  </ion-toolbar>

  <!-- SkolarWay Icon and Text -->
  <div class="skolarway-container">
    <img src="assets/images/2.png" alt="SkolarWay Logo" class="skolarway-logo" /> <!-- Your SkolarWay logo image -->
    <span class="skolarway-text">SkolarWay</span>
  </div>









  <!-- Back Button Top-Right -->

  <div class="top-back-button" routerLink="/messages">
    <ion-icon name="return-up-back" class="back-icon"></ion-icon>
  </div>
  

<!-- "To" Label + Input Side by Side -->
<div class="to-row">
  <label class="to-label">To:</label>
  <input type="text" placeholder="Type name of scholarship" class="to-input" />
</div>

<!-- Optional Message Body Area -->
<div class="message-body">
  <!-- Message history could go here -->
</div>

<!-- Message Input Fixed Above Footer -->
<div class="message-input-wrapper">
  <input type="text" placeholder="Enter your message" class="text-message" />
  <ion-icon name="send" class="send-icon"></ion-icon>
</div>


















<!-- Custom Footer Navigation -->
<div class="custom-footer">
  <a class="tab-button" routerLink="/home" routerLinkActive="active">
    <div class="icon-wrapper">
      <ion-icon name="home-outline"></ion-icon>
    </div>
    <span class="tab-label">Home</span>
  </a>

  <a class="tab-button" routerLink="/notifications" routerLinkActive="active">
    <div class="icon-wrapper">
      <ion-icon name="notifications-outline"></ion-icon>
    </div>
    <span class="tab-label">Notifications</span>
  </a>

  <a class="tab-button" routerLink="/messages" routerLinkActive="active">
    <div class="icon-wrapper">
      <ion-icon name="mail-outline"></ion-icon>
    </div>
    <span class="tab-label">Messages</span>
  </a>

  <a class="tab-button" routerLink="/profile" routerLinkActive="active">
    <div class="icon-wrapper">
      <ion-icon name="person-outline"></ion-icon>
    </div>
    <span class="tab-label">Profile</span>
  </a>
</div>
